# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "worldstat-atlas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[functions.data-proxy]
verify_jwt = false
