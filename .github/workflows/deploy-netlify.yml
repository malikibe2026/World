name: Deploy to Netlify

# Auto-deploy: production on every push to main, or on demand (Actions → Run workflow).
# No PR previews: every Netlify deploy uses the team's monthly credits, and previews used
# them up. Requires the repository secret NETLIFY_AUTH_TOKEN (Netlify → User settings →
# Applications → Personal access tokens) from an account in the team that owns the site.
# Without it the job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 90045eca-674e-48d2-accd-63f8cd7ee626   # worldstat-atlas (not a secret)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Netlify token
        id: token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not set; skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v6
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - run: npm run build
        if: steps.token.outputs.present == 'true'
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx -y netlify-cli@17 deploy --dir=dist --prod --site "$NETLIFY_SITE_ID" --message "main ${GITHUB_SHA::7}"
