<!doctype html>

<style>
:root { --navy:#070d18; --gold:#f2b84b; --gold2:#ffd68a; --blue:#7db3f5; --ink:#f5f8fc; --mute:#a9b8cc;
  --f-disp:'Plus Jakarta Sans', Inter, sans-serif; --f-body: Inter, sans-serif; --f-mono:'JetBrains Mono', monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

.kick { font-family: var(--f-disp); font-weight: 700; font-size: 17px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 16px; white-space: nowrap; }
.kick::before { content: ''; width: 44px; height: 2px; background: var(--gold); display: block; }
.mono { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
.k .kl { white-space: nowrap; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.03em 0.14em; margin-bottom: -0.1em; }
.w { display: inline-block; transform-origin: 0 100%; }
.acc { color: var(--gold); }
.gold { color: var(--blue); }
.shadow { text-shadow: 0 2px 24px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.5); }

.lt { position: absolute; padding: 20px 32px 22px 34px; background: rgba(5,10,20,.9); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.lt-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 12px 0 0 12px; background: var(--gold); transform-origin: 50% 0; }
.lt-k { font-family: var(--f-disp); font-weight: 700; font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.lt-tm { overflow: hidden; }
.lt-t { font-family: var(--f-disp); font-weight: 700; font-size: 32px; letter-spacing: -0.01em; color: #fff; white-space: nowrap; }

.browser { position: absolute; border-radius: 16px; overflow: hidden; background: #0d1626; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(140,180,240,.16); }
.chrome { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: linear-gradient(#162236, #111b2c); border-bottom: 1px solid rgba(255,255,255,.06); }
.chrome i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; display: block; }
.chrome i:nth-child(2) { background: #febc2e; } .chrome i:nth-child(3) { background: #28c840; }
.url { margin-left: 22px; flex: 0 1 520px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.06); color: #b9c7da; font-size: 15px; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.url b { color: #fff; font-weight: 600; }
.content { position: absolute; left: 0; overflow: hidden; }
.zw { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.zw img.shot { position: absolute; left: 0; top: 0; }
.callout { position: absolute; }
.callout svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; }
.callout .tag { position: absolute; left: -6px; bottom: calc(100% + 12px); transform-origin: 0 100%; white-space: nowrap; background: var(--gold); color: #1a1205; font-family: var(--f-disp); font-weight: 700; font-size: 20px; padding: 8px 14px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.callout .tag.below { bottom: auto; top: calc(100% + 12px); transform-origin: 0 0; }
.cursor { position: absolute; left: 0; top: 0; width: 34px; height: 40px; z-index: 5; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
.ripple { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--gold); z-index: 4; }
.phone { position: absolute; border-radius: 52px; background: linear-gradient(145deg, #2b3446, #0b0f17 60%); padding: 13px; box-shadow: 0 50px 100px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.08); }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: #000; }
.phone .scr img { width: 100%; height: 100%; display: block; }
.phone .island { position: absolute; left: 50%; top: 22px; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #000; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; background: rgba(5,10,20,.72); border: 1px solid rgba(255,255,255,.14); color: #fff; font-family: var(--f-disp); font-weight: 700; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; }
.toast { position: absolute; display: flex; align-items: center; gap: 18px; padding: 18px 22px; border-radius: 14px; background: rgba(13,27,46,.96); border: 1px solid rgba(120,170,240,.3); box-shadow: 0 30px 70px rgba(0,0,0,.5); font-size: 22px; font-weight: 600; white-space: nowrap; }
.toast .btn { background: #1c5cab; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 19px; }
.feat { display: flex; align-items: center; gap: 18px; font-size: 27px; font-weight: 500; color: #dfe8f5; }
.feat .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: rgba(242,184,75,.12); color: var(--gold); font-size: 24px; border: 1px solid rgba(242,184,75,.35); }
.flag { position: absolute; width: 150px; height: 112.5px; border-radius: 7px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); }
.flag img { width: 100%; height: 100%; display: block; object-fit: cover; }
.hud { font-family: var(--f-mono); font-size: 17px; letter-spacing: 0.14em; color: #e9f0fa; text-transform: uppercase; }
.hud b { color: var(--gold); font-weight: 500; }
#grain div { position: absolute; inset: -20px; background-size: 256px 256px; mix-blend-mode: overlay; display: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%); }
.bar { position: absolute; left: 0; right: 0; background: #000; z-index: 90; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 95; }
.attrib { position: absolute; right: 26px; bottom: 150px; font-size: 14px; color: rgba(255,255,255,.72); text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 91; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/path.js"></script>
<script type="module">
import { createEarth } from './lib/earth.js';
const FPS = 30;
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = typeof o[k] === 'number' && !['opacity', 'zIndex'].includes(k) ? o[k] + 'px' : o[k]; return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)), outCubic: (p) => 1 - Math.pow(1 - p, 3), inCubic: (p) => p * p * p,
  inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2), inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const SH = (n) => `shots/${n}.jpg`;
const stage = document.getElementById('stage');
const scenes = [];
function scene(a, b, z, build, draw) { const root = $('div', 'scene', stage); root.style.zIndex = z; const s = { a, b, root, draw }; build(root, s); scenes.push(s); return s; }
function K(parent, text, cls, pos) {
  const box = $('div', 'k ' + (cls || ''), parent); if (pos) css(box, pos);
  const words = [];
  text.split('|').forEach((line) => {
    const ln = $('div', 'kl', box);
    line.trim().split(/\s+/).forEach((w, i, arr) => {
      const acc = w.includes('*'), alt = w.includes('^');
      const m = $('span', 'mask', ln); const s = $('span', 'w' + (acc ? ' acc' : '') + (alt ? ' gold' : ''), m, w.replace(/[*^]/g, '').replace(/_/g, ' '));
      if (i < arr.length - 1) ln.appendChild(document.createTextNode(' '));
      words.push(s);
    });
  });
  return { box, words };
}
function kDraw(k, t, tin, tout, o = {}) {
  const st = o.st ?? 0.06, d = o.d ?? 0.8, od = o.od ?? 0.38;
  let any = false;
  k.words.forEach((w, i) => {
    const pi = E.outExpo(P(t, tin + i * st, tin + i * st + d));
    const po = tout == null ? 0 : E.inCubic(P(t, tout + i * st * 0.35, tout + i * st * 0.35 + od));
    w.style.transform = `translateY(${(1 - pi) * 112 - po * 112}%)`;
    w.style.opacity = Math.min(pi * 1.5, 1) * (1 - po);
    if (pi > 0 && po < 1) any = true;
  });
  k.box.style.visibility = any ? 'visible' : 'hidden';
}
function Kick(parent, text, pos) { const k = $('div', 'kick abs', parent, text); css(k, pos); return k; }
function kickDraw(k, t, tin, tout) { const p = E.outExpo(P(t, tin, tin + 0.7)), q = tout == null ? 0 : P(t, tout, tout + 0.3); k.style.opacity = p * (1 - q); k.style.transform = `translateX(${(1 - p) * -24}px)`; k.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; }
function LT(parent, kicker, title, pos) {
  const r = $('div', 'lt', parent); css(r, pos);
  const bar = $('div', 'lt-bar', r), kk = $('div', 'lt-k', r, kicker), tm = $('div', 'lt-tm', r), tt = $('div', 'lt-t', tm, title);
  return { r, bar, kk, tt };
}
function ltDraw(l, t, tin, tout) {
  const pi = E.outExpo(P(t, tin, tin + 0.75)), po = E.inCubic(P(t, tout, tout + 0.32));
  l.r.style.visibility = pi > 0 && po < 1 ? 'visible' : 'hidden';
  l.r.style.opacity = 1 - po;
  l.r.style.transform = `translateX(${-po * 40}px)`;
  l.r.style.clipPath = `inset(0 ${(1 - pi) * 100}% 0 0 round 12px)`;
  l.bar.style.transform = `scaleY(${E.outExpo(P(t, tin + 0.15, tin + 0.8))})`;
  l.kk.style.opacity = P(t, tin + 0.15, tin + 0.5);
  l.tt.style.transform = `translateY(${(1 - E.outExpo(P(t, tin + 0.2, tin + 0.95))) * 110}%)`;
}
let gid = 0;
const globe = () => { const id = 'bm' + gid++; return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#104281"/></linearGradient></defs><circle cx="32" cy="32" r="28" fill="url(#${id})"/><g fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="2.6"><ellipse cx="32" cy="32" rx="12" ry="28"/><path d="M4 32h56M9 18h46M9 46h46"/></g></svg>`; };
const CURSOR = `<svg viewBox="0 0 34 40"><path d="M3 2 L3 32 L10.5 25 L15.5 37 L21 34.6 L16 23 L26.5 23 Z" fill="#fff" stroke="#0a0f18" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
function Browser(parent, W, left, top, srcs) {
  const ch = Math.round(44 * W / 1500), H = Math.round(W * 900 / 1600);
  const root = $('div', 'browser', parent); css(root, { left, top, width: W, height: H + ch });
  const c = $('div', 'chrome', root); c.style.height = ch + 'px';
  $('i', '', c); $('i', '', c); $('i', '', c);
  $('div', 'url', c, `<span style="opacity:.7">🔒</span><b>worldstat-atlas</b>.netlify.app`);
  const content = $('div', 'content', root); css(content, { top: ch, width: W, height: H });
  const zw = $('div', 'zw', content); css(zw, { width: W, height: H });
  const imgs = {};
  for (const n of srcs) { const im = $('img', 'shot', zw); im.src = SH(n); css(im, { width: W, height: H, opacity: 0 }); imgs[n] = im; }
  return { root, content, zw, imgs, W, H, k: W / 1600 };
}
function Callout(parent, k, x, y, w, h, label, below) {
  const r = $('div', 'callout', parent); css(r, { left: x * k, top: y * k, width: w * k, height: h * k });
  r.innerHTML = `<svg preserveAspectRatio="none"><rect style="x:3px;y:3px;rx:12px;width:calc(100% - 6px);height:calc(100% - 6px)" pathLength="1" fill="rgba(242,184,75,.08)" stroke="#f2b84b" stroke-width="3" stroke-dasharray="1 1"/></svg>`;
  const tag = $('div', 'tag' + (below ? ' below' : ''), r, label);
  return { r, rect: r.querySelector('rect'), tag };
}
function calloutDraw(c, t, tin, tout, s = 1) {
  const pi = E.outCubic(P(t, tin, tin + 0.55)), po = P(t, tout, tout + 0.3);
  c.r.style.visibility = pi > 0 && po < 1 ? 'visible' : 'hidden';
  c.r.style.opacity = 1 - po;
  c.rect.style.strokeDashoffset = 1 - pi;
  c.rect.setAttribute('stroke-width', 3 / s);
  const tp = E.outBack(P(t, tin + 0.25, tin + 0.7));
  c.tag.style.transform = `scale(${(0.6 + 0.4 * tp) / s})`;
  c.tag.style.opacity = P(t, tin + 0.25, tin + 0.45);
}
function Phone(parent, src, w, x, y) {
  const h = Math.round((w - 26) * 1992 / 1170) + 26;
  const r = $('div', 'phone', parent); css(r, { left: x, top: y, width: w, height: h });
  const scr = $('div', 'scr', r); const im = $('img', '', scr); im.src = SH(src); $('div', 'island', r);
  return r;
}
function keyed(t, keys, f) {
  if (t <= keys[0].t) return keys[0];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b.t) { const p = (f || E.inOutCubic)(P(t, a.t, b.t)); const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], p); return o; }
  }
  return keys[keys.length - 1];
}
const flagUrl = (iso) => `shots/flags/${iso}.svg`;
window.FLAGS = (await (await fetch('shots/flags/list.json')).json()).iso;
window.DESC_DIR = new URL(location.href).searchParams.get('desc') || 'desc';

/* ================= EARTH layer · photoreal Earth from space (0 – 8.4, 12.45 – 16.5) ================= */
const earthRoot = $('div', 'scene', stage); earthRoot.style.zIndex = 12;
const earthCanvas = $('canvas', 'full', earthRoot); earthCanvas.width = 1920; earthCanvas.height = 1080;
const EARTH = await createEarth(earthCanvas);
function earthState(t) {
  if (t < 8.5) {
    const p = E.inOutCubic(P(t, 4.5, 6.6));
    return {
      lon: 102, lat: 4, dist: lerp(6.3 - 0.35 * P(t, 0, 4.5), 1.62, p), spin: lerp(-44, -30, P(t, 0, 8.5)), tilt: lerp(9, 2, p),
      shiftX: lerp(390, 0, p), shiftY: lerp(0, 1880, p), sunLon: lerp(4, 160, E.inOutSine(P(t, 4.3, 7.4))), sunLat: lerp(8, 38, p), stars: 1, exposure: 1,
    };
  }
  const c = window.PATH.camera(t);
  return { lon: c.lon, lat: c.lat, dist: c.dist, spin: c.spin, tilt: c.tilt, sunLon: 58, sunLat: 9, stars: clamp((c.dist - 1.8) / 3), exposure: 1 };
}

/* ================= S1 · Space open: cinematic + kinetic typography (0 – 6.4) ================= */
const S1 = {};
scene(0, 6.4, 25, (r) => {
  S1.k1 = K(r, 'Setiap tempat|ada *cerita.*', 'disp shadow', { position: 'absolute', left: 150, top: 400, fontSize: '92px' });
  S1.k2 = K(r, 'Setiap cerita|ada *angka.*', 'disp shadow', { position: 'absolute', left: 150, top: 400, fontSize: '92px' });
  S1.kick = Kick(r, 'Bumi · lebih 8 bilion penduduk', { left: 154, top: 350 });
}, (t) => {
  kickDraw(S1.kick, t, 0.4, 4.2);
  kDraw(S1.k1, t, 0.5, 2.25);
  kDraw(S1.k2, t, 2.45, 4.25);
});

/* ================= S2 · Logo over the Earth's horizon (4.9 – 8.4) ================= */
const S2 = {};
scene(4.9, 8.4, 26, (r) => {
  S2.logo = $('div', 'abs', r); css(S2.logo, { left: 0, right: 0, top: 250, height: 420, textAlign: 'center', transformOrigin: '50% 45%' });
  S2.ring = $('div', 'abs', S2.logo); css(S2.ring, { left: 960 - 64, top: 0, width: 128, height: 128, borderRadius: '50%', border: '2px solid rgba(242,184,75,.85)' });
  S2.mark = $('div', 'abs', S2.logo, globe()); css(S2.mark, { left: 960 - 64, top: 0, width: 128, height: 128 });
  S2.word = $('div', 'abs disp', S2.logo, 'WORLDSTAT <span style="color:var(--gold)">ATLAS</span>'); css(S2.word, { left: 0, right: 0, top: 168, fontSize: '96px', letterSpacing: '0.1em' });
  S2.rule = $('div', 'abs', S2.logo); css(S2.rule, { left: 960 - 160, top: 296, width: 320, height: 2, background: 'linear-gradient(90deg, transparent, #f2b84b, transparent)' });
  S2.tag = K(S2.logo, 'Atlas statistik interaktif — dari angkasa hingga ke kampung.', '', { position: 'absolute', left: 0, right: 0, top: 322, fontSize: '30px', fontWeight: 500, color: '#c7d4e6' });
}, (t) => {
  const out = E.inCubic(P(t, 7.85, 8.4));
  S2.logo.style.opacity = (t >= 5.0 ? 1 : 0) * (1 - out);
  S2.logo.style.transform = `translateY(${-out * 40}px)`;
  const m = E.outBack(P(t, 5.0, 5.6));
  S2.mark.style.transform = `scale(${0.3 + 0.7 * m})`; S2.mark.style.opacity = P(t, 5.0, 5.15);
  const rg = P(t, 5.05, 6.2); S2.ring.style.transform = `scale(${1 + rg * 2.6})`; S2.ring.style.opacity = (1 - rg) * (t > 5.05 ? 0.9 : 0);
  const wp = E.outExpo(P(t, 5.15, 6.2)); S2.word.style.letterSpacing = `${0.5 - 0.4 * wp}em`; S2.word.style.opacity = wp;
  S2.rule.style.transform = `scaleX(${E.outExpo(P(t, 5.6, 6.5))})`;
  kDraw(S2.tag, t, 5.75, null, { st: 0.035 });
});

/* ================= S3 · World flags wall (2.5D) + infographic counter, dive into Malaysia (8.125 – 12.6) ================= */
const S3 = {};
const FL = { w: 150, h: 112.5, gx: 22, gy: 24, rows: 9, cols: 40, myRow: 4, myCol: 20 };
const SC3 = scene(8.125, 12.6, 30, (r) => {
  r.style.background = '#050912';
  r.style.perspective = '1700px';
  S3.wall = $('div', 'abs', r); css(S3.wall, { left: 0, top: 0, width: FL.cols * (FL.w + FL.gx), height: FL.rows * (FL.h + FL.gy), transformOrigin: '0 0', transformStyle: 'preserve-3d' });
  S3.rows = [];
  const list = window.FLAGS; let k = 0;
  for (let ri = 0; ri < FL.rows; ri++) {
    const row = $('div', 'abs', S3.wall); css(row, { left: 0, top: ri * (FL.h + FL.gy), width: FL.cols * (FL.w + FL.gx), height: FL.h });
    for (let ci = 0; ci < FL.cols; ci++) {
      const iso = ri === FL.myRow && ci === FL.myCol ? 'my' : list[k++ % list.length];
      const f = $('div', 'flag', row); css(f, { left: ci * (FL.w + FL.gx), top: 0 });
      const im = $('img', '', f); im.src = flagUrl(iso);
      if (iso === 'my') S3.my = f;
    }
    S3.rows.push(row);
  }
  S3.shade = $('div', 'abs', r); css(S3.shade, { inset: 0, background: 'radial-gradient(ellipse 58% 60% at 50% 52%, rgba(4,8,16,.95) 0%, rgba(4,8,16,.86) 48%, rgba(4,8,16,.25) 82%, rgba(4,8,16,.55) 100%)' });
  S3.kick = Kick(r, 'Satu atlas · seluruh dunia', { left: 0, right: 0, top: 330, justifyContent: 'center' });
  S3.num = $('div', 'abs disp', r, '0'); css(S3.num, { left: 0, right: 0, top: 368, textAlign: 'center', fontSize: '210px', fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.04em' });
  S3.lab = K(r, 'negara & *wilayah*', 'disp2', { position: 'absolute', left: 0, right: 0, top: 600, textAlign: 'center', fontSize: '58px' });
  S3.sub = $('div', 'abs', r, '74 penunjuk statistik &nbsp;·&nbsp; 1950 → 2100 &nbsp;·&nbsp; UN, World Bank & DOSM'); css(S3.sub, { left: 0, right: 0, top: 700, textAlign: 'center', fontSize: '26px', fontWeight: 500, color: '#c7d4e6' });
}, (t) => {
  const tt = t - 8.125;
  S3.rows.forEach((row, ri) => { row.style.transform = `translateX(${ri === FL.myRow ? 0 : (ri % 2 ? 1 : -1) * (36 + ri * 4) * tt}px)`; });
  // focus point: wall centre, then the Malaysian flag

/* ---------- global overlays + render ---------- */
const grain = $('div', '', stage); grain.id = 'grain'; css(grain, { position: 'absolute', inset: 0, zIndex: 80, pointerEvents: 'none' });
const grains = [0, 1, 2, 3, 4, 5].map((i) => { const g = $('div', '', grain); g.style.backgroundImage = `url(shots/noise${i}.png)`; return g; });
const vig = $('div', '', stage); vig.id = 'vig'; vig.style.zIndex = 81;
const barT = $('div', 'bar', stage), barB = $('div', 'bar', stage);
barT.style.top = '0'; barB.style.bottom = '0';
const flash = $('div', '', stage); flash.id = 'flash';

async function render(t) {
  // Earth (WebGL) — opening, logo horizon, and the descent until the map takes over
  const earthOn = t < 8.45 || (t >= 12.45 && t < 16.5);
  earthRoot.style.display = earthOn ? 'block' : 'none';
  if (earthOn) {
    EARTH.draw(earthState(t));
    earthRoot.style.opacity = t < 8.45 ? 1 - P(t, 8.125, 8.45) : 1 - P(t, 16.1, 16.45);
  }
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.root.style.display = on ? 'block' : 'none';
    if (on) await s.draw(t);
  }
  const lb = 138 * (1 - E.inOutCubic(P(t, 24.75, 25.35)));
  barT.style.height = barB.style.height = lb + 'px';
  barT.style.display = barB.style.display = lb > 0.5 ? 'block' : 'none';
  const f = Math.round(t * FPS);
  grains.forEach((g, i) => { g.style.display = i === f % 6 ? 'block' : 'none'; g.style.backgroundPosition = `${(f * 73) % 256}px ${(f * 151) % 256}px`; });
  grain.style.opacity = t < 25 ? 0.1 : t < 55.7 ? 0.06 : 0.02;
  vig.style.opacity = t < 55.7 ? 1 : 0;
  const fl = [[53.125, 0.22], [54.375, 0.22]].map(([c, a]) => (t >= c && t < c + 0.12 ? a * (1 - P(t, c, c + 0.12)) : 0));
  const dive = t >= 12.2 && t < 12.95 ? (t < 12.5 ? 0.9 * P(t, 12.2, 12.5) : 0.9 * (1 - P(t, 12.5, 12.95))) : 0;
  flash.style.opacity = Math.max(dive, ...fl);
}
