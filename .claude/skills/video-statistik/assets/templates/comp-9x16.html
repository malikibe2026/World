<div id="stage"></div>

<script type="module">
import { createEarth } from './lib/earth.js';
const FPS = 30;
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = typeof o[k] === 'number' && !['opacity', 'zIndex'].includes(k) ? o[k] + 'px' : o[k]; return e; };

const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)), outCubic: (p) => 1 - Math.pow(1 - p, 3), inCubic: (p) => p * p * p,

  outBack: (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const SH = (n) => `shots/${n}.jpg`;
const stage = document.getElementById('stage');
const scenes = [];
function scene(a, b, z, build, draw) { const root = $('div', 'scene', stage); root.style.zIndex = z; const s = { a, b, root, draw }; build(root, s); scenes.push(s); return s; }
function K(parent, text, cls, pos) {

}
function kDraw(k, t, tin, tout, o = {}) {
  const st = o.st ?? 0.06, d = o.d ?? 0.8, od = o.od ?? 0.38;
  let any = false;
  k.words.forEach((w, i) => {

}
function Kick(parent, text, pos) { const k = $('div', 'kick abs', parent, text); css(k, pos); return k; }
function kickDraw(k, t, tin, tout) { const p = E.outExpo(P(t, tin, tin + 0.7)), q = tout == null ? 0 : P(t, tout, tout + 0.3); k.style.opacity = p * (1 - q); k.style.transform = `translateX(${(1 - p) * -24}px)`; k.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; }
function LT(parent, kicker, title, pos) {
  const r = $('div', 'lt', parent); css(r, pos);
  const bar = $('div', 'lt-bar', r), kk = $('div', 'lt-k', r, kicker), tm = $('div', 'lt-tm', r), tt = $('div', 'lt-t', tm, title);
  return { r, bar, kk, tt };
}
function ltDraw(l, t, tin, tout) {
  const pi = E.outExpo(P(t, tin, tin + 0.75)), po = E.inCubic(P(t, tout, tout + 0.32));

  l.r.style.opacity = 1 - po;
  l.r.style.transform = `translateX(${-po * 40}px)`;
  l.r.style.clipPath = `inset(0 ${(1 - pi) * 100}% 0 0 round 12px)`;
  l.bar.style.transform = `scaleY(${E.outExpo(P(t, tin + 0.15, tin + 0.8))})`;
  l.kk.style.opacity = P(t, tin + 0.15, tin + 0.5);
  l.tt.style.transform = `translateY(${(1 - E.outExpo(P(t, tin + 0.2, tin + 0.95))) * 110}%)`;
}
let gid = 0;
const globe = () => { const id = 'bm' + gid++; return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#104281"/></linearGradient></defs><circle cx="32" cy="32" r="28" fill="url(#${id})"/><g fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="2.6"><ellipse cx="32" cy="32" rx="12" ry="28"/><path d="M4 32h56M9 18h46M9 46h46"/></g></svg>`; };
const CURSOR = `<svg viewBox="0 0 34 40"><path d="M3 2 L3 32 L10.5 25 L15.5 37 L21 34.6 L16 23 L26.5 23 Z" fill="#fff" stroke="#0a0f18" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
function Browser(parent, W, left, top, srcs) {
  const ch = Math.round(44 * W / 1500), H = Math.round(W * 900 / 1600);
  const root = $('div', 'browser', parent); css(root, { left, top, width: W, height: H + ch });
  const c = $('div', 'chrome', root); c.style.height = ch + 'px';
  $('i', '', c); $('i', '', c); $('i', '', c);
  $('div', 'url', c, `<span style="opacity:.7">🔒</span><b>worldstat-atlas</b>.netlify.app`);
  const content = $('div', 'content', root); css(content, { top: ch, width: W, height: H });
  const zw = $('div', 'zw', content); css(zw, { width: W, height: H });
  const imgs = {};
  for (const n of srcs) { const im = $('img', 'shot', zw); im.src = SH(n); css(im, { width: W, height: H, opacity: 0 }); imgs[n] = im; }
  return { root, content, zw, imgs, W, H, k: W / 1600 };

function Callout(parent, k, x, y, w, h, label, below) {
  const r = $('div', 'callout', parent); css(r, { left: x * k, top: y * k, width: w * k, height: h * k });
  r.innerHTML = `<svg preserveAspectRatio="none"><rect style="x:3px;y:3px;rx:12px;width:calc(100% - 6px);height:calc(100% - 6px)" pathLength="1" fill="rgba(242,184,75,.08)" stroke="#f2b84b" stroke-width="3" stroke-dasharray="1 1"/></svg>`;

const STATUS = (k) => `<div style="position:absolute;left:0;right:0;top:0;height:${46 * k}px;background:#0b1424;display:flex;align-items:center;justify-content:space-between;padding:0 ${30 * k}px 0 ${38 * k}px;font:600 ${17 * k}px Inter;color:#fff;z-index:2"><span>9:41</span><span style="display:flex;gap:${6 * k}px;align-items:center"><svg width="${18 * k}" height="${11 * k}" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#fff"/></svg><svg width="${25 * k}" height="${12 * k}" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="#fff"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg></span></div>`;

  }

const flagUrl = (iso) => `shots/flags/${iso}.svg`;

window.DESC_DIR = new URL(location.href).searchParams.get('desc') || 'desc';

/* ===== Vertical 9:16 (1080×1920) for TikTok & Reels. Safe area for text: x 70–920, y 250–1480. ===== */
const VW = 1080, VH = 1920, CX = 540, CY = 960;

/* ================= EARTH layer ================= */
const earthRoot = $('div', 'scene', stage); earthRoot.style.zIndex = 12;
const earthCanvas = $('canvas', 'full', earthRoot); earthCanvas.width = VW; earthCanvas.height = VH;

/* ================= S1 · Space open (0 – 6.4) ================= */
const S1 = {};
scene(0, 6.4, 25, (r) => {
  S1.kick = Kick(r, 'Bumi · lebih 8 bilion penduduk', { left: 84, top: 330 });
  S1.k1 = K(r, 'Setiap tempat|ada *cerita.*', 'disp shadow', { position: 'absolute', left: 80, top: 380, fontSize: '104px' });

  kickDraw(S1.kick, t, 0.4, 4.2);
  kDraw(S1.k1, t, 0.5, 2.25);
  kDraw(S1.k2, t, 2.45, 4.25);

/* ================= S2 · Logo over the horizon (4.9 – 8.4) ================= */
const S2 = {};
scene(4.9, 8.4, 26, (r) => {
  S2.logo = $('div', 'abs', r); css(S2.logo, { left: 0, right: 0, top: 520, height: 640, textAlign: 'center', transformOrigin: '50% 40%' });
  S2.ring = $('div', 'abs', S2.logo); css(S2.ring, { left: CX - 72, top: 0, width: 144, height: 144, borderRadius: '50%', border: '2px solid rgba(242,184,75,.85)' });

  S2.rule = $('div', 'abs', S2.logo); css(S2.rule, { left: CX - 150, top: 462, width: 300, height: 2, background: 'linear-gradient(90deg, transparent, #f2b84b, transparent)' });
  S2.tag = K(S2.logo, 'Atlas statistik interaktif —|dari angkasa hingga ke kampung.', '', { position: 'absolute', left: 0, right: 0, top: 492, fontSize: '34px', fontWeight: 500, color: '#c7d4e6', lineHeight: '1.35' });
}, (t) => {

/* ================= S3 · World flags wall + counter, dive into Malaysia (8.125 – 12.6) ================= */
const S3 = {};
const FL = { w: 150, h: 112.5, gx: 22, gy: 24, rows: 15, cols: 24, myRow: 7, myCol: 12 };
const SC3 = scene(8.125, 12.6, 30, (r) => {

  r.style.perspective = '1700px';
  S3.wall = $('div', 'abs', r); css(S3.wall, { left: 0, top: 0, width: FL.cols * (FL.w + FL.gx), height: FL.rows * (FL.h + FL.gy), transformOrigin: '0 0', transformStyle: 'preserve-3d' });

    const row = $('div', 'abs', S3.wall); css(row, { left: 0, top: ri * (FL.h + FL.gy), width: FL.cols * (FL.w + FL.gx), height: FL.h });

/* ---------- global overlays + render ---------- */
const grain = $('div', '', stage); grain.id = 'grain'; css(grain, { position: 'absolute', inset: 0, zIndex: 80, pointerEvents: 'none' });
const grains = [0, 1, 2, 3, 4, 5].map((i) => { const g = $('div', '', grain); g.style.backgroundImage = `url(shots/noise${i}.png)`; return g; });
const vig = $('div', '', stage); vig.id = 'vig'; vig.style.zIndex = 81;
const flash = $('div', '', stage); flash.id = 'flash';

async function render(t) {
  const earthOn = t < 8.45 || (t >= 12.45 && t < 16.5);
  earthRoot.style.display = earthOn ? 'block' : 'none';
  if (earthOn) {
    EARTH.draw(earthState(t));
    earthRoot.style.opacity = t < 8.45 ? 1 - P(t, 8.125, 8.45) : 1 - P(t, 16.1, 16.45);
  }
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.root.style.display = on ? 'block' : 'none';
    if (on) await s.draw(t);
  }
  const f = Math.round(t * FPS);
  grains.forEach((g, i) => { g.style.display = i === f % 6 ? 'block' : 'none'; g.style.backgroundPosition = `${(f * 73) % 256}px ${(f * 151) % 256}px`; });
  grain.style.opacity = t < 25 ? 0.09 : t < 55.7 ? 0.05 : 0.02;
  vig.style.opacity = t < 55.7 ? 1 : 0;
  const fl = [[53.125, 0.22], [54.375, 0.22]].map(([c, a]) => (t >= c && t < c + 0.12 ? a * (1 - P(t, c, c + 0.12)) : 0));
  const dive = t >= 12.2 && t < 12.95 ? (t < 12.5 ? 0.9 * P(t, 12.2, 12.5) : 0.9 * (1 - P(t, 12.5, 12.95))) : 0;
  flash.style.opacity = Math.max(dive, ...fl);
}
window.render = render;
